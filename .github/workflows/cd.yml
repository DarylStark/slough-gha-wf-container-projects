---
on:
  workflow_call:
    inputs:
      container-file:
        description: "The containerfile."
        type: string
        required: false
        default: "src/Dockerfile"
      container-context:
        description: "The context folder for the containerfile."
        type: string
        required: false
        default: "src/"
      platforms:
        description: "The platforms to build for."
        type: string
        required: false
        default: "linux/arm64,linux/amd64"
      container-repository:
        type: string
        description: "The name for the repository for the container."
        required: true
      container-name:
        type: string
        description: "The name for the container. Defaults to the reponame."
        required: false
        default: ""
      version:
        type: string
        description: "The version of the software. Used for a tag."
        required: false
    secrets:
      DOCKER_USERNAME:
        description: "Docker Hub username."
        required: false
      DOCKER_PASSWORD:
        description: "Docker Hub password. This should be a PAT."
        required: false

jobs:

  generate-tags:
    name: Generate tags
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.generate-tags.outputs.tags }}
    steps:
      - name: Set container tags
        id: generate-tags
        uses: DarylStark/slough-gha-ac-container-tag-generator@v1
        with:
          container-repository: ${{ inputs.container-repository }}
          container-name: ${{ inputs.container-name }}
          version: ${{ inputs.version }}

  cd-deploy:
    runs-on: ubuntu-latest
    needs: generate-tags
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.container-context }}
          push: true
          platforms: ${{ inputs.platforms }}
          file: ${{ inputs.container-file }}
          tags: ${{ needs.generate-tags.outputs.tags }}